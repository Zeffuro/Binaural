name: Prepare ASMR recordings

on:
  push:
    branches: [main]
    paths: ['scripts/prepare-asmr-recordings.py', '.github/workflows/prepare-asmr-recordings.yml']
  workflow_dispatch:
    inputs:
      inspect_only:
        description: Inspect original WAV signals without preparing assets
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install preparation dependencies
        run: python -m pip install numpy==2.5.5 scipy==1.18.1 soundfile==0.14.0
      - name: Verify and prepare pinned original recordings
        env:
          INSPECT_ONLY: ${{ inputs.inspect_only }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$INSPECT_ONLY" == "true" ]]; then args+=(--inspect-only); fi
          python scripts/prepare-asmr-recordings.py "${args[@]}"
      - name: Preserve recordings, licensing evidence and signal audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asmr-prepared
          path: asmr-prepared/
          if-no-files-found: error
          retention-days: 14
