name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      PULSE_SINK: binaural_ci
      BINAURAL_CI_DISPLAY: xvfb
      WAYLAND_DISPLAY: ''
      MOZ_ENABLE_WAYLAND: '0'
      GDK_BACKEND: x11
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check browser test isolation
        run: node --test scripts/test-browser.test.mjs
      - name: Check audio models and adaptive quality
        run: node --experimental-strip-types --test tests/asmr-model.test.mjs tests/adaptive-visual-quality.test.mjs
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Start the virtual audio output
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=binaural_ci rate=48000 channels=2
          pactl set-default-sink binaural_ci
          pactl list short sinks
      - name: Check live audio and WebGL 2
        run: xvfb-run -a node scripts/check-browser-runtime.mjs
      - name: Check types and build
        run: npm run build
        env:
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
      - name: Run Chromium, Firefox and accessibility smoke tests
        run: xvfb-run -a npm run test:full -- --forbid-only --workers=1
      - name: Check the production Pages artifact
        run: xvfb-run -a npm run check:pages
      - name: Check offline playback and safe app updates
        run: xvfb-run -a npm run check:offline
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  windows-audio:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and Firefox
        run: npx playwright install chromium firefox
      - name: Check types and build on Windows
        run: npm run build
      - name: Check Windows offline synthesis in both browsers
        run: npm run test:full -- tests/audio.spec.ts tests/asmr-audio.spec.ts tests/asmr-modes.spec.ts tests/bwg-audio.spec.ts tests/background-audio.spec.ts tests/timeline.spec.ts --grep-invert "timer gate silences|ASMR follows pause|whole BWGen mute|ASMR starts with|pending recording" --forbid-only --workers=1

  deploy:
    needs: [build, windows-audio]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
