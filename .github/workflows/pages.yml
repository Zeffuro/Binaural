name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      PULSE_SINK: binaural_ci
      BINAURAL_CI_DISPLAY: xvfb
      WAYLAND_DISPLAY: ''
      MOZ_ENABLE_WAYLAND: '0'
      GDK_BACKEND: x11
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check browser test isolation
        run: node --test scripts/test-browser.test.mjs
      - name: Check audio models and adaptive quality
        run: node --experimental-strip-types --test tests/asmr-model.test.mjs tests/asmr-library.test.mjs tests/adaptive-visual-quality.test.mjs
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Start the virtual audio output
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio ffmpeg
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=binaural_ci rate=48000 channels=2
          pactl set-default-sink binaural_ci
          pactl list short sinks
      - name: Check live audio and WebGL 2
        run: xvfb-run -a node scripts/check-browser-runtime.mjs
      - name: Check types and build
        run: npm run build
        env:
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
      - name: Check video codecs and live audio clocks
        run: xvfb-run -a node scripts/test-browser.mjs --full tests/video-recording.spec.ts tests/generated-background-ui.spec.ts --grep "recorded canvas and stereo engine mix independently decode|recording includes native BWGen, stereo local music and ASMR|normal ambience uses the generated PCM and retains pause and audio-clock stop" --forbid-only --workers=1 --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Check listening workspace and visual controls
        run: xvfb-run -a node scripts/test-browser.mjs --full tests/accessibility.spec.ts tests/discovery.spec.ts tests/asmr-ui.spec.ts tests/asmr-visuals.spec.ts tests/asmr-workspace.spec.ts tests/asmr-modes.spec.ts tests/asmr-library.spec.ts tests/asmr-spatial-ui.spec.ts tests/listening-sources.spec.ts tests/light-triggers.spec.ts tests/visual-workspace.spec.ts tests/visualizer.spec.ts --forbid-only --workers=1 --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Run Chromium, Firefox and accessibility smoke tests
        run: xvfb-run -a node scripts/test-browser.mjs --full --grep-invert "recorded canvas and stereo engine mix independently decode|recording includes native BWGen, stereo local music and ASMR|normal ambience uses the generated PCM and retains pause and audio-clock stop|(?:accessibility|discovery|asmr-ui|asmr-visuals|asmr-workspace|asmr-modes|asmr-library|asmr-spatial-ui|listening-sources|light-triggers|visual-workspace|visualizer)\.spec\.ts" --forbid-only --workers=1 --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Preserve Linux test reports and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-linux
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Check the production Pages artifact
        run: xvfb-run -a npm run check:pages
      - name: Check offline playback and safe app updates
        run: xvfb-run -a npm run check:offline
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  windows-audio:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and Firefox
        run: npx playwright install chromium firefox
      - name: Check types and build on Windows
        run: npm run build
      - name: Check Windows offline synthesis in both browsers
        run: node scripts/test-browser.mjs --full tests/audio.spec.ts tests/asmr-audio.spec.ts tests/asmr-modes.spec.ts tests/asmr-textures.spec.ts tests/asmr-spatial.spec.ts tests/bwg-audio.spec.ts tests/background-audio.spec.ts tests/timeline.spec.ts tests/audio-export.spec.ts tests/long-wav-export.spec.ts tests/wav-timing.spec.ts tests/bwg-export-source.spec.ts tests/music-export-asset.spec.ts tests/music-flac-export.spec.ts tests/flac-encoder.spec.ts tests/export-formats.spec.ts tests/video-recording.spec.ts tests/video-visual-capture.spec.ts tests/video-export.spec.ts --grep-invert "timer gate silences|ASMR follows pause|whole BWGen mute|ASMR starts with|pending recording|@live" --forbid-only --workers=1 --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Preserve Windows test reports and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-windows
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, windows-audio]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
