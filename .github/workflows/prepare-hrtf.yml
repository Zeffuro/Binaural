name: Prepare HRTF assets

on:
  push:
    branches: [main]
    paths: ['scripts/prepare-hrtf.py', '.github/workflows/prepare-hrtf.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install preparation dependencies
        run: python -m pip install numpy==2.5.5 h5py==3.16.0 scipy==1.18.1
      - name: Verify and prepare pinned profiles
        run: python scripts/prepare-hrtf.py --audit hrtf-source-audit.json
      - name: Preserve verified profiles and source audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hrtf-prepared
          path: |
            public/audio/hrtf/
            public/licenses/sadie-ii*
            hrtf-source-audit.json
          if-no-files-found: error
          retention-days: 14
